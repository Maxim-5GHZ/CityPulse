# CityPulse TLS-front (только PROD): терминирует HTTPS и проксирует внутрь по plain HTTP.
# API идёт через /backend/* напрямую на backend (rewrite в /api/*),
# остальное — на frontend (Next.js standalone).

# Апстримы через переменные: nginx резолвит имена в момент запроса
# (докер-DNS 127.0.0.11), поэтому порядок старта контейнеров не важен.

# HTTP — только редирект на HTTPS
server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate /etc/nginx/certs/citypulse.crt;
  ssl_certificate_key /etc/nginx/certs/citypulse.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  client_max_body_size 25m;

  resolver 127.0.0.11 valid=30s;
  set $upstream_frontend frontend:3000;
  set $upstream_backend backend:8080;

  # API: /backend/auth/login -> backend /api/auth/login
  location /backend/ {
    rewrite ^/backend/(.*)$ /api/$1 break;
    proxy_pass http://$upstream_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # Возврат от Флида ID: зарегистрированный redirect_uri смотрит на фронт-origin,
  # а код обрабатывает бэкенд. Точное совпадение (не префикс!), остальной /flida/* — фронт.
  location = /flida/oauth2/callback {
    proxy_pass http://$upstream_backend/api/auth/flida/callback;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # Всё остальное — фронт
  location / {
    proxy_pass http://$upstream_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
}

# Маппинг Upgrade-заголовка для вебсокетов (верхний уровень)
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}
