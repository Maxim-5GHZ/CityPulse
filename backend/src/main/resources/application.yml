server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/citypulse}
    username: ${SPRING_DATASOURCE_USERNAME:citypulse}
    password: ${SPRING_DATASOURCE_PASSWORD:citypulse}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # V3__district_scenarios.sql добавлен после того, как V4 уже применился
    # на существующих dev-базах — разрешаем догоняющую миграцию не по порядку.
    out-of-order: true
  devtools:
    restart:
      enabled: true

app:
  jwt-secret: ${JWT_SECRET:change-me-to-at-least-32-chars-long-secret!}
  jwt-ttl-minutes: 720
  # Сид админа на старте (AdminBootstrap). Дефолтов нет: пустой email или
  # пароль = не создавать. Значения только из ENV, в репо их не хранить.
  admin-email: ${APP_ADMIN_EMAIL:}
  admin-password: ${APP_ADMIN_PASSWORD:}
  # Флида ID в схеме Web SDK (public-клиент, секрета нет): бэкенд только
  # проверяет Flida access_token через userinfo и минтит наш JWT.
  flida:
    userinfo-uri: ${FLIDA_USERINFO_URI:https://id.flida.ru/api/oidc/userinfo}
