server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/citypulse}
    username: ${SPRING_DATASOURCE_USERNAME:citypulse}
    password: ${SPRING_DATASOURCE_PASSWORD:citypulse}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  devtools:
    restart:
      enabled: true

app:
  jwt-secret: ${JWT_SECRET:change-me-to-at-least-32-chars-long-secret!}
  jwt-ttl-minutes: 720
  # Сид админа на старте (AdminBootstrap). Пустой email = не создавать.
  admin-email: ${APP_ADMIN_EMAIL:}
  admin-password: ${APP_ADMIN_PASSWORD:admin}
  # Флида ID (confidential-клиент, всё сервер-сервер; секрет сюда прилетает только из env контейнера).
  flida:
    client-id: ${FLIDA_CLIENT_ID:}
    client-secret: ${FLIDA_CLIENT_SECRET:}
    authorize-uri: ${FLIDA_AUTHORIZE_URI:https://id.flida.ru/api/oidc/authorize}
    token-uri: ${FLIDA_TOKEN_URI:https://id.flida.ru/api/oidc/token}
    userinfo-uri: ${FLIDA_USERINFO_URI:https://id.flida.ru/api/oidc/userinfo}
    redirect-uri: ${FLIDA_REDIRECT_URI:http://localhost:3000/flida/oauth2/callback}
    frontend-url: ${FLIDA_FRONTEND_URL:http://localhost:3000}
