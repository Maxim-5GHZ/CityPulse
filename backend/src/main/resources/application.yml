server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/citypulse}
    username: ${SPRING_DATASOURCE_USERNAME:citypulse}
    password: ${SPRING_DATASOURCE_PASSWORD:citypulse}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  devtools:
    restart:
      enabled: true

app:
  jwt-secret: ${JWT_SECRET:change-me-to-at-least-32-chars-long-secret!}
  jwt-ttl-minutes: 720
  # Сид админа на старте (AdminBootstrap). Пустой email = не создавать.
  admin-email: ${APP_ADMIN_EMAIL:}
  admin-password: ${APP_ADMIN_PASSWORD:admin}
  # Флида ID в схеме Web SDK (public-клиент, секрета нет): бэкенд только
  # проверяет Flida access_token через userinfo и минтит наш JWT.
  flida:
    userinfo-uri: ${FLIDA_USERINFO_URI:https://id.flida.ru/api/oidc/userinfo}
